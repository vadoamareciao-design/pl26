<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polonia 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polonia">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --pg:#ffffff;        /* carta */
    --tx:#15181d;        /* inchiostro */
    --gr:#6a7280;        /* grigio */
    --gr2:#9aa1ac;       /* grigio chiaro */
    --ln:#e6e8ec;        /* righe */
    --rd:#c8102e;        /* rosso polacco: solo per gli orari e le cose fisse */
    --vd:#1a7f4b;        /* verde: confermato */
    --ar:#b26a00;        /* ambra: da confermare */
    --bx:#fbf3f2;        /* fondo degli avvisi */
    --sb: env(safe-area-inset-bottom, 0px);
    --st: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--pg); color:var(--tx);
    font:17px/1.62 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding-bottom:calc(66px + var(--sb));
    overscroll-behavior-y:none;
  }
  a{color:inherit}

  /* ---------------- testata ---------------- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--ln);
    padding:12px 20px 11px; padding-top:calc(12px + var(--st));
  }
  header h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px}
  header .sub{color:var(--gr2); font-size:12.5px; margin-top:1px}
  #net{display:none; background:#fff4e5; color:#8a5200; font-size:13px;
       text-align:center; padding:7px 16px; border-bottom:1px solid #f0dcbe}
  body.offline #net{display:block}
  #upd{display:none; width:100%; border:0; border-bottom:1px solid #b9e0c8;
       background:#eaf7ef; color:#14603c; font:inherit; font-size:14px; font-weight:600;
       text-align:center; padding:11px 16px; cursor:pointer}
  body.aggiornato #upd{display:block}
  #upd:active{background:#dcf0e4}

  main{padding:0 20px 40px; max-width:680px; margin:0 auto}
  .view{display:none} .view.on{display:block}

  /* ---------------- testata del giorno ---------------- */
  .dh{padding:26px 0 6px}
  .dh .kick{font-size:12.5px; font-weight:700; letter-spacing:.9px;
            text-transform:uppercase; color:var(--rd)}
  .dh h2{margin:7px 0 0; font-size:27px; line-height:1.22;
         font-weight:700; letter-spacing:-.5px}
  .dh .meta{color:var(--gr); font-size:15px; margin-top:11px}
  .dh .cap{margin-top:18px; font-size:16px; color:#3a4048; line-height:1.6}

  /* ---------------- una tappa ---------------- */
  .tp{padding:26px 0; border-top:1px solid var(--ln)}
  .tp:first-of-type{border-top:1px solid var(--tx)}
  .tp .ora{font-size:14px; font-weight:700; color:var(--rd);
           font-variant-numeric:tabular-nums; letter-spacing:.2px}
  .tp .ora .lk{font-size:12px; color:var(--gr2); font-weight:600; margin-left:6px}
  /* Il colore sta SULL'ORA, non su etichette aggiunte: l'ora e' la cosa che si
     guarda per prima, e colorata dice gia' che tipo di momento e'.
     Niente pastiglie, niente maiuscoletto: si legge come un orario ferroviario. */
  .tp.t-spost  .ora{color:#1257a8}
  .tp.t-pasto  .ora{color:#a35a00}
  .tp.t-visita .ora{color:#15181d}
  .tp.t-riposo .ora{color:#9aa1ac; font-weight:600}
  .tp.t-fisso  .ora{color:var(--rd)}
  /* il filo della giornata: una riga verticale sottile che lega le tappe in fila */
  .tp{position:relative; padding-left:19px}
  .tp::before{content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--ln)}
  .tp::after{content:""; position:absolute; left:-2.5px; top:32px; width:6px; height:6px;
             border-radius:50%; background:currentColor; color:var(--ln)}
  .tp.t-spost::after {color:#1257a8} .tp.t-pasto::after{color:#a35a00}
  .tp.t-fisso::after {color:var(--rd)} .tp.t-visita::after{color:#15181d}
  .tp:first-of-type::before{top:26px}
  .tp:last-of-type::before{bottom:auto; height:38px}
  /* lo STATO batte il tipo: confermato e da-confermare restano riconoscibili */
  .tp.ok  .ora{color:var(--vd)} .tp.ok::after {color:var(--vd)}
  .tp.apr .ora{color:var(--ar)} .tp.apr::after{color:var(--ar)}

  /* alternative: se il locale salta, il ripiego e' gia' pronto da toccare */
  .alt{margin-top:14px; border-top:1px solid var(--ln)}
  .alt .v{padding:15px 0 0}
  .alt .v h5{margin:0; font-size:16.5px; font-weight:650; letter-spacing:-.2px}
  .alt .v p{margin:5px 0 0; font-size:15px; color:var(--gr); line-height:1.5}
  .tp.ok  .ora{color:var(--vd)}
  .tp.apr .ora{color:var(--ar)}
  .tp h3{margin:6px 0 0; font-size:20px; line-height:1.32;
         font-weight:650; letter-spacing:-.3px}
  .tp .dove{margin-top:9px; color:var(--gr); font-size:15.5px; line-height:1.55}
  .tp .nota{margin-top:14px; font-size:16px; color:#33393f; line-height:1.66}
  .tp .att{margin-top:16px; background:var(--bx); border-left:3px solid var(--rd);
           padding:14px 16px; font-size:15.5px; line-height:1.62; color:#5c2a26;
           border-radius:0 8px 8px 0}
  .tp .att b{color:var(--rd)}

  .btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px}
  .btn{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
       font-size:16px; font-weight:600; padding:12px 18px; border-radius:10px;
       border:1.5px solid var(--tx); color:var(--tx); background:#fff; min-height:46px}
  .btn.tel{border-color:var(--ln); color:var(--gr); font-weight:500}
  .btn:active{background:#f2f3f5}
  .btn svg{width:19px; height:19px; stroke:currentColor; fill:none;
           stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
  .btn.vai{border-color:var(--tx)}

  /* ---------------- la storia del posto ---------------- */
  details.st{margin-top:14px}
  details.st summary{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
        list-style:none; font-size:15px; font-weight:600; color:var(--gr);
        border:1.5px solid var(--ln); border-radius:10px; padding:10px 16px; min-height:44px}
  details.st summary::-webkit-details-marker{display:none}
  details.st summary svg{width:18px; height:18px; stroke:currentColor; fill:none;
        stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  details.st[open] summary{color:var(--tx); border-color:var(--tx); border-radius:10px 10px 0 0;
        border-bottom-color:transparent}
  .stbox{border:1.5px solid var(--tx); border-top:0; border-radius:0 10px 10px 10px;
         padding:16px 18px 15px; margin-top:-1px}
  .stbox p{margin:0; font-size:16px; line-height:1.66; color:#33393f}
  .stbox a{display:inline-block; margin-top:13px; font-size:14.5px; font-weight:600;
           color:var(--gr); text-decoration:none; border-bottom:1.5px solid var(--ln); padding-bottom:2px}

  /* ---------------- to-do spuntabile ---------------- */
  .it.sp{display:flex; gap:14px; align-items:flex-start}
  .it.sp .box{flex:0 0 auto; width:27px; height:27px; margin-top:1px; border-radius:7px;
       border:1.8px solid var(--gr2); background:#fff; cursor:pointer; padding:0;
       display:flex; align-items:center; justify-content:center}
  .it.sp .box svg{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2.6;
       stroke-linecap:round; stroke-linejoin:round; opacity:0}
  .it.sp .txt{flex:1 1 auto; min-width:0}
  .it.fatta .box{background:var(--vd); border-color:var(--vd)}
  .it.fatta .box svg{opacity:1}
  .it.fatta h3{color:var(--gr2); text-decoration:line-through; text-decoration-thickness:1px}
  .it.fatta p, .it.fatta .kick{color:var(--gr2)}
  .it.fatta.rossa h3{color:var(--gr2)}
  .fatte-lab{margin-top:36px}

  /* ---------------- code della giornata ---------------- */
  .coda{margin-top:34px; padding-top:26px; border-top:1px solid var(--tx)}
  .bx{margin-bottom:22px}
  .bx .lab{display:block; font-size:12.5px; font-weight:700; letter-spacing:.9px;
           text-transform:uppercase; color:var(--gr2); margin-bottom:7px}
  .bx p{margin:0; font-size:16px; line-height:1.66; color:#33393f}

  /* ---------------- selettore dei giorni ---------------- */
  .pills{display:flex; gap:8px; overflow-x:auto; padding:16px 0 4px;
         scrollbar-width:none; margin:0 -20px; padding-left:20px; padding-right:20px}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto; background:#fff; border:1.5px solid var(--ln); color:var(--gr);
        border-radius:10px; padding:9px 14px; font:inherit; font-size:14.5px;
        font-weight:650; cursor:pointer; white-space:nowrap; line-height:1.25; text-align:center}
  .pill span{display:block; font-size:11.5px; font-weight:500; color:var(--gr2); margin-top:1px}
  .pill.on{background:var(--tx); border-color:var(--tx); color:#fff}
  .pill.on span{color:#b9bfc8}

  /* ---------------- liste delle altre schede ---------------- */
  h4.sec{font-size:12.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
         color:var(--gr2); margin:36px 0 0; padding-bottom:10px; border-bottom:1px solid var(--tx)}
  h4.sec:first-child{margin-top:26px}
  .it{padding:24px 0; border-top:1px solid var(--ln)}
  .it:first-of-type{border-top:0}
  .it h3{margin:0; font-size:19px; line-height:1.34; font-weight:650; letter-spacing:-.25px}
  .it p{margin:10px 0 0; font-size:16px; line-height:1.66; color:#33393f}
  .it.rossa h3{color:var(--rd)}
  .it .kick{display:block; font-size:12px; font-weight:700; letter-spacing:.8px;
            text-transform:uppercase; color:var(--gr2); margin-bottom:6px}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.5px;
       padding:3px 8px; border-radius:5px; background:#f3f4f6; color:var(--gr);
       margin-left:8px; vertical-align:2px; text-transform:uppercase}

  .intro{margin:26px 0 0; padding:18px 20px; background:var(--bx);
         border-left:3px solid var(--rd); border-radius:0 8px 8px 0;
         font-size:16px; line-height:1.62; color:#5c2a26}
  .intro.verde{background:#f0f8f3; border-color:var(--vd); color:#1c4a33}

  .q{display:block; font-size:22px; font-weight:700; letter-spacing:-.4px}

  /* ---------------- barra in fondo ---------------- */
  nav{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
      background:rgba(255,255,255,.96); backdrop-filter:saturate(180%) blur(12px);
      border-top:1px solid var(--ln); padding-bottom:var(--sb)}
  nav button{flex:1; min-width:0; background:none; border:0; font:inherit;
             font-size:10px; font-weight:600; color:var(--gr2); cursor:pointer;
             padding:9px 2px 8px; display:flex; flex-direction:column;
             align-items:center; gap:3px; letter-spacing:.1px}
  nav button svg{width:21px; height:21px; stroke:currentColor; fill:none;
                 stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  nav button.on{color:var(--tx)}
  nav button{position:relative}
  .bdg{position:absolute; top:4px; left:50%; margin-left:5px; min-width:17px; height:17px;
       padding:0 4px; border-radius:9px; background:var(--rd); color:#fff;
       font-size:10.5px; font-weight:700; line-height:17px; text-align:center}
  .foot{margin-top:46px; padding-top:20px; border-top:1px solid var(--ln);
        color:var(--gr2); font-size:13px; line-height:1.6; text-align:center}
</style>
</head>
<body>

<header>
  <h1 id="hT">Polonia 2026</h1>
  <div class="sub" id="hS">4 &ndash; 11 agosto</div>
</header>
<div id="net">Sei offline. L&rsquo;app funziona lo stesso &mdash; solo i percorsi hanno bisogno di rete.</div>
<button id="upd">C&rsquo;&egrave; una versione nuova &mdash; tocca per aggiornare</button>

<main>
  <section class="view" id="v-oggi"></section>
  <section class="view" id="v-giorni"><div class="pills" id="pills"></div><div id="gbox"></div></section>
  <section class="view" id="v-dafare"></section>
  <section class="view" id="v-pren"></section>
  <section class="view" id="v-tel"></section>
  <section class="view" id="v-soldi"></section>
</main>

<nav id="nav"></nav>

<script src="dati.js"></script>
<script>
(function(){
  "use strict";
  /* "io" oppure "famiglia". La versione dei familiari la genera
     crea-versione-famiglia.py, che qui sotto scrive "famiglia".
     Differenze: i familiari hanno TUTTE le mappe, ma non la scheda "Da fare"
     ne' i numeri dei fornitori — quelli restano a Raffaele, perche' se
     telefonano in due allo stesso ristorante nasce il doppio tavolo. */
  var MODO = "famiglia";
  var FAM  = (MODO === "famiglia");
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function tel(t){ return String(t).replace(/^(\+\d\d)(\d{3})(\d{3})(\d+)$/, "$1 $2 $3 $4"); }

  /* icone della barra: tratti semplici, niente emoji */
  var ICONE = {
    oggi:  '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
    giorni:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    dafare:'<path d="M4 12.5l5 5L20 6.5"/>',
    pren:  '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>',
    tel:   '<path d="M6.5 3h3l1.5 4-2 1.5a13 13 0 006.5 6.5L17 13l4 1.5v3a2 2 0 01-2.2 2A17.5 17.5 0 013.5 5.2 2 2 0 015.5 3z"/>',
    soldi: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.8 9.4c-.5-.9-1.6-1.4-2.8-1.4-1.7 0-2.8.8-2.8 2s1.1 1.9 2.8 2 2.8.8 2.8 2-1.1 2-2.8 2c-1.2 0-2.3-.5-2.8-1.4"/>',
    storia:'<path d="M4 5.5A2.5 2.5 0 016.5 3H11v17H6.5A2.5 2.5 0 004 22.5zM20 5.5A2.5 2.5 0 0017.5 3H13v17h4.5a2.5 2.5 0 012.5 2.5z"/>'
  };

  /* Come ci si va: il tasto lo dice a parole, cosi' non si parte in auto per sbaglio */
  var MODI = {
    walking: { et:"A piedi &mdash; portami l&igrave;",
               ic:'<path d="M13 4.5a1.6 1.6 0 100-.1zM11 21l1.6-5.2-2.1-2.1V9.5L8 11v3H6v-4.2l4.6-2.6c.9-.5 2-.2 2.6.6l1.3 2c.6.9 1.6 1.4 2.7 1.4V13c-1.6 0-3.1-.7-4.1-1.9l-.5 2.6 2 2v5.3z"/>' },
    transit: { et:"Coi mezzi &mdash; portami l&igrave;",
               ic:'<rect x="5" y="3" width="14" height="13" rx="2.5"/><path d="M5 9h14M8.5 20l-1.5 2M15.5 20l1.5 2M8 16h.01M16 16h.01M9 3h6"/><path d="M7 16h10"/>' },
    driving: { et:"In auto &mdash; portami l&igrave;",
               ic:'<path d="M5 17h14M6.5 17V19a1 1 0 01-1 1H4.5a1 1 0 01-1-1v-2M20.5 17V19a1 1 0 01-1 1h-1a1 1 0 01-1-1v-2"/><path d="M3.5 17v-4l2-5.2A2 2 0 017.4 6.5h9.2a2 2 0 011.9 1.3l2 5.2v4z"/><path d="M4.5 13h15M7.5 15h.01M16.5 15h.01"/>' }
  };
  var VOCI = [["oggi","Oggi"],["giorni","Giorni"],["dafare","Da fare"],
              ["pren","Prenot."],["tel","Numeri"],["soldi","Soldi"]];
  if (FAM) VOCI = VOCI.filter(function(v){ return v[0] !== "dafare"; });
  $("#nav").innerHTML = VOCI.map(function(v){
    return '<button data-v="'+v[0]+'"><svg viewBox="0 0 24 24">'+ICONE[v[0]]+'</svg>'+v[1]+'</button>';
  }).join("");

  /* ---------- che giorno e' oggi ---------- */
  function iso(){ var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function indiceOggi(){
    var t=iso(), g=VIAGGIO.giorni;
    for (var i=0;i<g.length;i++) if (g[i].data===t) return i;
    if (t < g[0].data) return -1;
    if (t > g[g.length-1].data) return -2;
    return 0;
  }

  /* ---------- una tappa ---------- */
  function tappa(x){
    var c = "tp" + (x.tipo ? " t-"+x.tipo : "") + (x.ok ? " ok" : x.aperta ? " apr" : "");
    var h = '<article class="'+c+'">';
    if (x.ora) h += '<div class="ora">'+esc(x.ora)+(x.fisso?' <span class="lk">ORARIO FISSO</span>':'')+'</div>';
    h += '<h3>'+esc(x.titolo)+'</h3>';
    if (x.dove) h += '<div class="dove">'+esc(x.dove)+'</div>';
    if (x.attenzione) h += '<div class="att"><b>Attenzione.</b> '+esc(x.attenzione)+'</div>';
    if (x.note) h += '<p class="nota">'+esc(x.note)+'</p>';
    var numero = FAM ? null : x.tel;   /* i numeri dei fornitori restano a Raffaele */
    if (x.vai || numero || (x.mail && !FAM)){
      h += '<div class="btns">';
      /* Un solo tasto per andarci, e dice COME: il percorso parte da dove sei
         in questo momento (nessun punto di partenza fisso) e col mezzo giusto. */
      if (x.vai) h += '<a class="btn vai" href="'+esc(x.vai)+'" target="_blank" rel="noopener">'
                    + '<svg viewBox="0 0 24 24" aria-hidden="true">'+MODI[x.modo].ic+'</svg>'
                    + MODI[x.modo].et + '</a>';
      if (numero)  h += '<a class="btn tel" href="tel:'+esc(numero)+'">'+esc(tel(numero))+'</a>';
      /* la mail della prenotazione: apre Gmail con la ricerca gia' fatta.
         Nel file non ci sono codici ne' identificativi: solo il nome da cercare.
         Serve la rete — le mail non si leggono in aereo. */
      if (x.mail && !FAM) h += '<a class="btn tel" href="'+esc(x.mail)+'" target="_blank" rel="noopener">'
                             + '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>La mail</a>';
      h += '</div>';
    }
    /* La storia del posto: due righe che si leggono anche senza rete,
       e sotto il link per chi ne vuole di piu'. C'e' in tutte e due le versioni. */
    if (x.storia){
      h += '<details class="st"><summary><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONE.storia+'</svg>Storia</summary>'
         + '<div class="stbox"><p>'+esc(x.storia.testo)+'</p>'
         + '<a href="'+esc(x.storia.url)+'" target="_blank" rel="noopener">Leggi tutto su '
         + esc(x.storia.fonte)+' &rarr;</a></div></details>';
    }
    return h+'</article>';
  }

  /* ---------- un giorno ---------- */
  function giorno(g){
    var h = '<div class="dh"><div class="kick">Giorno '+g.n+' &middot; '+esc(g.etichetta)+'</div>'
          + '<h2>'+esc(g.titolo)+'</h2>'
          + '<div class="meta">Sveglia '+esc(g.sveglia)+' &middot; notte a '+esc(g.base)
          + ' &middot; carico '+esc(g.carico)+'</div>';
    if (g.cappello) h += '<p class="cap">'+esc(g.cappello)+'</p>';
    h += '</div>';
    g.tappe.forEach(function(t){ h += tappa(t); });
    var coda = "";
    if (g.pianoB)      coda += box("Piano B se piove", g.pianoB);
    if (g.valvola)     coda += box("Valvola, se siamo cotti", g.valvola);
    if (g.alternative) coda += box("Alternative", g.alternative) + alternative(g.alternativeVoci);
    if (g.nota)        coda += box("Nota", g.nota);
    if (coda) h += '<div class="coda">'+coda+'</div>';
    return h;
  }
  function box(l,t){ return '<div class="bx"><span class="lab">'+esc(l)+'</span><p>'+esc(t)+'</p></div>'; }

  /* i ripieghi non sono piu' testo da ricopiare a mano: si toccano e basta */
  function alternative(voci){
    if (!voci || !voci.length) return "";
    var h = '<div class="alt">';
    voci.forEach(function(v){
      h += '<div class="v"><h5>'+esc(v.n)+'</h5>';
      if (v.d) h += '<p>'+esc(v.d)+'</p>';
      h += '<div class="btns">';
      if (v.vai) h += '<a class="btn vai" href="'+esc(v.vai)+'" target="_blank" rel="noopener">'
                    + '<svg viewBox="0 0 24 24" aria-hidden="true">'+MODI.walking.ic+'</svg>Portami l&igrave;</a>';
      if (v.tel && !FAM) h += '<a class="btn tel" href="tel:'+esc(v.tel)+'">'+esc(tel(v.tel))+'</a>';
      h += '</div></div>';
    });
    return h+'</div>';
  }

  /* ---------- schede ---------- */
  function vOggi(){
    var i = indiceOggi(), h = "";
    if (i === -1){
      var g0 = VIAGGIO.giorni[0];
      var gg = Math.round((new Date(g0.data+"T00:00:00") - new Date(iso()+"T00:00:00"))/864e5);
      h = '<div class="dh"><div class="kick">Non si è ancora partiti</div>'
        + '<h2>Mancano '+gg+' giorn'+(gg===1?'o':'i')+'</h2>'
        + '<p class="cap">Qui sotto il primo giorno. Quello che va chiuso prima di partire sta nella scheda <b>Da fare</b>.</p></div>'
        + giorno(g0);
    } else if (i === -2){
      h = '<div class="dh"><h2>Viaggio finito</h2>'
        + '<p class="cap">Bentornato. I giorni restano tutti nella scheda Giorni.</p></div>';
    } else h = giorno(VIAGGIO.giorni[i]);
    $("#v-oggi").innerHTML = h + foot();
  }

  var sel = 0;
  function pills(){
    $("#pills").innerHTML = VIAGGIO.giorni.map(function(g,i){
      var p = g.etichetta.split(" ");
      return '<button class="pill'+(i===sel?" on":"")+'" data-i="'+i+'">G'+g.n
           + '<span>'+esc(p[1]+" "+p[2].slice(0,3))+'</span></button>';
    }).join("");
  }
  function vGiorni(){ pills(); $("#gbox").innerHTML = giorno(VIAGGIO.giorni[sel]) + foot(); window.scrollTo(0,0); }
  $("#pills").addEventListener("click", function(e){
    var b = e.target.closest(".pill"); if(!b) return; sel = +b.dataset.i; vGiorni();
  });

  var SPUNTA = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function riga(x, cls, fatta){
    var sp = !!x.id;
    var h = '<div class="it'+(cls?" "+cls:"")+(sp?" sp":"")+(fatta?" fatta":"")+'"'
          + (sp ? ' data-id="'+esc(x.id)+'"' : '') + '>';
    if (sp) h += '<button class="box" aria-label="Segna come fatta">'+SPUNTA+'</button><div class="txt">';
    if (x.kick) h += '<span class="kick">'+esc(x.kick)+'</span>';
    h += '<h3>'+esc(x.titolo)+(x.aggiunta?'<span class="tag">aggiunta</span>':'')+'</h3>';
    if (x.testo) h += '<p>'+esc(x.testo)+'</p>';
    if (x.tel) h += '<div class="btns"><a class="btn tel" href="tel:'+esc(x.tel)+'">'+esc(tel(x.tel))+'</a></div>';
    if (sp) h += '</div>';
    return h+'</div>';
  }

  /* ---------- to-do viva ----------
     La spunta si salva sul telefono sotto l'id STABILE della voce, non sotto il testo:
     cosi' se il testo di una voce viene riscritto, la spunta non si perde.
     Funziona senza rete. Resta sul telefono di chi la mette: non gira sugli altri. */
  var CHIAVE = "polonia2026:fatte";
  function fatte(){
    try { return JSON.parse(localStorage.getItem(CHIAVE) || "{}"); } catch(e){ return {}; }
  }
  function salvaFatte(o){ try { localStorage.setItem(CHIAVE, JSON.stringify(o)); } catch(e){} }

  function vDaFare(){
    var p = VIAGGIO.primaDiPartire;
    var tutte = [].concat(
      p.rosse  .map(function(x){ return {v:x, sez:"Le tre cose serie",           cls:"rossa"}; }),
      p.online .map(function(x){ return {v:x, sez:"Online, prima di partire",    cls:""}; }),
      p.piccole.map(function(x){ return {v:x, sez:"Le piccole rimaste indietro", cls:""}; })
    );
    /* se una voce sparisce da dati.js, la sua spunta si butta */
    var f = fatte(), vivi = {}, ripulito = false;
    tutte.forEach(function(t){ if (t.v.id) vivi[t.v.id] = 1; });
    Object.keys(f).forEach(function(k){ if (!vivi[k]) { delete f[k]; ripulito = true; } });
    if (ripulito) salvaFatte(f);

    var h = "", sez = "", aperte = tutte.filter(function(t){ return !f[t.v.id]; });
    aperte.forEach(function(t){
      if (t.sez !== sez) { h += '<h4 class="sec">'+esc(t.sez)+'</h4>'; sez = t.sez; }
      h += riga(t.v, t.cls, false);
    });
    if (!aperte.length) h += '<div class="intro verde">Non &egrave; rimasto niente da fare. Buon viaggio.</div>';

    /* le fatte scendono in fondo, in grigio: non spariscono, si possono rileggere */
    var chiuse = tutte.filter(function(t){ return f[t.v.id]; });
    if (chiuse.length){
      h += '<h4 class="sec fatte-lab">Fatte &middot; '+chiuse.length+'</h4>';
      chiuse.forEach(function(t){ h += riga(t.v, t.cls, true); });
    }
    h += '<h4 class="sec">Regole ferme</h4>';
    VIAGGIO.regole.forEach(function(r){ h += riga({titolo:r.t, testo:r.d}); });
    $("#v-dafare").innerHTML = h + foot();
  }

  $("#v-dafare").addEventListener("click", function(e){
    var b = e.target.closest(".box"); if (!b) return;
    var it = b.closest(".it"), id = it && it.getAttribute("data-id"); if (!id) return;
    var f = fatte();
    if (f[id]) delete f[id]; else f[id] = Date.now();
    salvaFatte(f);
    vDaFare(); badge();
  });

  /* il numero delle cose ancora aperte, sulla barra in fondo: si vede senza entrare */
  function badge(){
    var b = document.querySelector('#nav button[data-v="dafare"]'); if (!b) return;
    var p = VIAGGIO.primaDiPartire, f = fatte();
    var n = [].concat(p.rosse, p.online, p.piccole).filter(function(x){ return !f[x.id]; }).length;
    var e = b.querySelector(".bdg");
    if (!n) { if (e) e.remove(); return; }
    if (!e) { e = document.createElement("span"); e.className = "bdg"; b.appendChild(e); }
    e.textContent = n;
  }

  function vPren(){
    var P = VIAGGIO.prenotazioni;
    var h = '<div class="intro">'+esc(P.avviso)+'</div>';
    P.voci.forEach(function(x){ h += riga({kick:x.tipo, titolo:x.t, testo:x.d}); });
    $("#v-pren").innerHTML = h + foot();
  }

  function vTel(){
    var h = "";
    var GRUPPI_FAM = ["Emergenze", "Hotel", "Attivita'", "Attività"];
    VIAGGIO.telefoni.forEach(function(gr){
      if (FAM && GRUPPI_FAM.indexOf(gr.gruppo) === -1) return;
      h += '<h4 class="sec">'+esc(gr.gruppo)+'</h4>';
      gr.voci.forEach(function(v){ h += riga({titolo:v.n, testo:v.nota, tel:v.t, aggiunta:v.aggiunta}); });
    });
    $("#v-tel").innerHTML = h + foot();
  }

  function vSoldi(){
    var S = VIAGGIO.soldi, C = VIAGGIO.cassa;
    var h = '<div class="intro verde">'+esc(S.riassunto)+'</div>';
    h += '<h4 class="sec">Le uscite in contanti</h4>';
    S.voci.forEach(function(v){
      h += '<div class="it"><span class="q">'+esc(v.q)+'</span>'
         + '<h3 style="margin-top:4px">'+esc(v.t)+'</h3><p>'+esc(v.d)+'</p></div>';
    });
    h += '<h4 class="sec">Si comprano in cassa</h4>';
    h += '<div class="it"><p style="margin-top:18px">'+esc(C.intro)+'</p></div>';
    C.voci.forEach(function(v){
      h += '<div class="it"><span class="kick">'+esc(v.g)+'</span><span class="q">'+esc(v.q)+'</span>'
         + '<h3 style="margin-top:4px">'+esc(v.t)+'</h3><p>'+esc(v.d)+'</p></div>';
    });
    h += '<h4 class="sec">Documenti in tasca</h4>';
    h += '<div class="it"><p style="margin-top:18px">'+esc(S.documenti)+'</p></div>';
    $("#v-soldi").innerHTML = h + foot();
  }

  function foot(){
    return '<div class="foot">Contenuto dai file del progetto, aggiornato al '
         + esc(VIAGGIO.aggiornato)+'.<br>I codici di prenotazione stanno nel PDF, non qui.</div>';
  }

  /* ---------- navigazione ---------- */
  var fatto = {}, R = {oggi:vOggi, giorni:vGiorni, dafare:vDaFare, pren:vPren, tel:vTel, soldi:vSoldi};
  function vai(v){
    if (!fatto[v]) { R[v](); fatto[v] = true; }
    document.querySelectorAll(".view").forEach(function(s){ s.classList.remove("on"); });
    $("#v-"+v).classList.add("on");
    document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.v===v); });
    window.scrollTo(0,0);
  }
  $("#nav").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return; vai(b.dataset.v);
  });

  /* ---------- avvio ---------- */
  $("#hT").textContent = VIAGGIO.titolo;
  $("#hS").textContent = VIAGGIO.sottotitolo;
  var i = indiceOggi(); sel = (i>=0) ? i : 0;
  vai("oggi");
  if (!FAM) badge();

  function rete(){ document.body.classList.toggle("offline", !navigator.onLine); }
  addEventListener("online", rete); addEventListener("offline", rete); rete();

  /* ---------- aggiornamenti ----------
     L'app si apre sempre dalla copia salvata (istantanea, funziona in aereo)
     e nello stesso momento va a controllare se ne esiste una piu' recente.
     Se la trova, compare la barra verde: un tocco e si ricarica. */
  $("#upd").addEventListener("click", function(){ location.reload(); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", function(e){
      if (e.data && e.data.tipo === "aggiornamento") document.body.classList.add("aggiornato");
    });

    function controlla(){
      if (!navigator.onLine) return;
      navigator.serviceWorker.ready.then(function(reg){
        reg.update().catch(function(){});
        if (reg.active) reg.active.postMessage("controlla");
      });
    }

    addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(){ controlla(); }).catch(function(){});
    });
    /* ogni volta che riapri l'icona dalla Home */
    addEventListener("visibilitychange", function(){ if (!document.hidden) controlla(); });
    addEventListener("online", controlla);
  }
})();
</script>
</body>
</html>
